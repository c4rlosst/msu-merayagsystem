project_id = "msu-merayagsystem"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enabled = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth.email.template.magic_link]
subject = "Your MERAYAG verification code"
content_path = "./supabase/templates/verification.html"

[auth.email.template.confirmation]
subject = "Verify your MERAYAG account"
content_path = "./supabase/templates/verification.html"
